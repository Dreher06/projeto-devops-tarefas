name: Integracao Continua
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar sintaxe JavaScript
        run: npm run check
      - name: Executar testes automatizados
        run: npm test
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Verificar formatacao
        run: terraform -chdir=terraform fmt -check
      - name: Inicializar Terraform
        run: terraform -chdir=terraform init -backend=false
      - name: Validar Terraform
        run: terraform -chdir=terraform validate

  entrega:
    name: Build e Publicação Docker
    needs: [testes, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/dreher06/projeto-devops-tarefas:latest
            ghcr.io/dreher06/projeto-devops-tarefas:${{ github.sha }}

